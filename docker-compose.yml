services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-Change_this_password_123!}
    ports: ["1433:1433"]
    volumes:
      - sql-data:/var/opt/mssql
      - ./backend/database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on: { sqlserver: { condition: service_healthy } }
    volumes: ["./backend/database:/scripts:ro"]
    environment: { SQL_PASSWORD: "${SQL_PASSWORD:-Change_this_password_123!}" }
    entrypoint: ["/bin/bash","-c","/opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P '$${SQL_PASSWORD}' -i /scripts/init.sql"]
    restart: "no"
  api:
    build: { context: ./backend, dockerfile: AdDatabase.API/Dockerfile }
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AdDatabase;User Id=sa;Password=${SQL_PASSWORD:-Change_this_password_123!};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET:-replace-this-with-a-secure-random-32-byte-secret}"
      FrontendUrl: http://localhost:4200
    ports: ["8080:8080"]
volumes: { sql-data: {} }
